<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上億國際｜試算結果</title>
<link rel="icon" href="favicon.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="favicon.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.logo img{width:180px;height:auto;display:block;margin:0 auto}
.car-url{font-size:13px;color:#64748b;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0;line-height:1.5;text-align:center}
.notice{text-align:center;font-size:13px;line-height:1.8;color:#64748b}.notice a{font-weight:800}
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">
<main class="max-w-xl mx-auto px-4 py-8">
<div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
<div class="bg-slate-900 text-white text-center px-5 py-7">
<div class="logo mb-3"><img src="logo.jpg" alt="上億國際"></div>
<div class="text-sm text-slate-300">韓國 Encar 車輛試算結果</div>
</div>
<div class="p-5 sm:p-7">
<div class="text-center">
<div class="text-2xl sm:text-3xl font-black text-slate-900">🎉 試算完成 🎉</div>
<div class="text-sm text-slate-500 mt-2">預估主要金額</div>
<div class="mt-5 flex justify-center items-baseline gap-2 whitespace-nowrap">
<span class="text-2xl sm:text-3xl text-slate-400 font-black">NT$</span>
<span id="total" class="font-black text-blue-600 tracking-tighter leading-none text-[clamp(3.2rem,16vw,6rem)]">試算結果</span>
</div>
</div>
<div id="carUrlBox" class="car-url mt-6"></div>
<div class="mt-6 bg-slate-50 rounded-2xl border border-slate-200 p-5 text-center">
<div class="text-sm font-bold text-slate-700 mb-4">📱 下一步</div>
<div class="space-y-3 text-sm text-slate-600">
<div class="flex items-center justify-center gap-2"><div class="w-7 h-7 rounded-full bg-blue-600 text-white font-black flex items-center justify-center">1</div><div>點擊下方按鈕開啟專員 LINE</div></div>
<div class="flex items-center justify-center gap-2"><div class="w-7 h-7 rounded-full bg-blue-600 text-white font-black flex items-center justify-center">2</div><div>確認已複製試算結果</div></div>
<div class="flex items-center justify-center gap-2"><div class="w-7 h-7 rounded-full bg-blue-600 text-white font-black flex items-center justify-center">3</div><div>在聊天輸入框<strong style="color:red;">長按 → 貼上 → 傳送</strong></div></div>
</div></div>
<button onclick="copyAndOpenLine()" class="w-full mt-5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 text-base">
<i class="fa-brands fa-line text-2xl"></i>複製結果・開啟專員 LINE
</button>
<div class="text-center text-sm font-bold mt-3" id="status"></div>
<div class="notice mt-5">
洽詢專線：詹經理 <a href="tel:0928131216">0928-131216</a><br><br>
<a href="index.html" target="_blank" rel="noopener">→ 回到上億國際主網站 ←</a>
</div>
<div class="mt-6 text-center text-xs text-slate-400 leading-relaxed">上億國際 · 一條龍完整服務<br>從挑車、引進、過戶到售後<br>05-285-2066</div>
</div></div>
<div class="text-center text-[11px] text-slate-400 mt-5">本試算金額僅供參考，實際費用依正式合約為準。</div>
</main>
<script>
const params=new URLSearchParams(window.location.search);
const total=params.get('total')||'';
const carUrl=params.get('carUrl')||'';
function formatMoney(v){const n=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n.toLocaleString('en-US'):''}
const formattedTotal=formatMoney(total);
document.getElementById('total').textContent=formattedTotal||'試算結果';
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m])}
document.getElementById('carUrlBox').innerHTML=carUrl?'<a href="'+escapeHtml(carUrl)+'" target="_blank" rel="noopener">您試算的車輛網址</a>':'未提供車輛網址';
function copyAndOpenLine(){
const message="您好，我在上億國際試算韓國 Encar 車輛預估主要金額約為 NT$ "+formattedTotal+"元\n"+(carUrl?"車輛網址："+carUrl+"\n":"")+"\n上億國際 · 一條龍完整服務✨從挑車、引進、過戶到售後，為您提供完整服務 05-285-2066";
navigator.clipboard.writeText(message).then(()=>{document.getElementById('status').textContent='已複製試算結果，即將開啟 LINE。';window.open('https://line.me/ti/p/NtUpGMqsZm','_blank')}).catch(()=>{document.getElementById('status').textContent='複製失敗，請手動複製試算結果。'})
}
</script>
</body>
</html>
